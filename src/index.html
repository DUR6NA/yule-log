<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yule Log</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body data-phase="out">
    <canvas id="hearth" aria-hidden="true"></canvas>
    <div class="hearth-fallback" aria-hidden="true"></div>

    <figure class="thermometer glass" id="thermometer" aria-labelledby="btu-label">
      <svg id="thermo" width="56" height="148" viewBox="0 0 56 148" aria-hidden="true"></svg>
      <figcaption id="btu-label">
        <span class="btu" id="btu">–</span>
        <span class="unit">BTU/h</span>
      </figcaption>
    </figure>

    <div class="notice glass" id="notice" role="alert" hidden>
      <p id="notice-text"></p>
      <button class="icon-button small" id="notice-close" type="button" aria-label="Dismiss">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7m0-7l-7 7" /></svg>
      </button>
    </div>

    <div class="dock glass" id="dock">
      <button class="light" id="toggle" type="button">
        <svg class="icon flame" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5Z" />
        </svg>
        <svg class="icon snuff" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.25" y="4.25" width="7.5" height="7.5" rx="1.6" /></svg>
        <span id="toggle-label">Light</span>
      </button>

      <div class="readout">
        <p class="status" id="status" role="status">Starting…</p>
        <p class="detail" id="detail"></p>
      </div>

      <span class="divider" aria-hidden="true"></span>

      <button class="chip" id="timer-chip" type="button" popovertarget="timer-panel">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8.8" r="5.3" /><path d="M8 5.9v3l1.9 1.2M6.4 1.8h3.2" />
        </svg>
        <span class="visually-hidden">Auto-off:</span>
        <span id="timer-label">15m</span>
      </button>

      <button class="icon-button" id="settings-button" type="button" popovertarget="settings-panel" aria-label="Model server settings" title="Settings">
        <svg class="gear" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>

      <button class="icon-button" id="fullscreen" type="button" aria-label="Full screen" title="Full screen (F)">
        <svg class="expand" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" /></svg>
        <svg class="collapse" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5V6H2.5M13.5 6H10V2.5M10 13.5V10h3.5M2.5 10H6v3.5" /></svg>
      </button>
    </div>

    <div class="panel glass" id="timer-panel" popover aria-labelledby="timer-title">
      <h2 id="timer-title">Auto-off</h2>
      <div class="presets" role="radiogroup" aria-labelledby="timer-title">
        <label><input type="radio" name="auto-off" value="15" /><span>15m</span></label>
        <label><input type="radio" name="auto-off" value="30" /><span>30m</span></label>
        <label><input type="radio" name="auto-off" value="60" /><span>1h</span></label>
        <label><input type="radio" name="auto-off" value="120" /><span>2h</span></label>
        <label><input type="radio" name="auto-off" value="never" /><span>Never</span></label>
      </div>
      <form class="custom-time" id="custom-form">
        <label for="custom-time">Custom</label>
        <input id="custom-time" type="text" placeholder="45m, 1h 30m, 6h" autocomplete="off" spellcheck="false" />
        <button type="submit" class="small-button">Set</button>
      </form>
      <p class="panel-note" id="timer-note"></p>
    </div>

    <form class="panel glass settings" id="settings-panel" popover aria-labelledby="settings-title">
      <h2 id="settings-title">Model server</h2>
      <p class="panel-note">LM Studio, or any local OpenAI-compatible server.</p>
      <div class="presets servers" aria-label="Common servers">
        <button type="button" data-url="http://127.0.0.1:1234">LM Studio</button>
        <button type="button" data-url="http://127.0.0.1:11434">Ollama</button>
        <button type="button" data-url="http://127.0.0.1:8080">llama.cpp</button>
        <button type="button" data-url="http://127.0.0.1:1337">Jan</button>
      </div>
      <label class="field">
        <span>Server URL</span>
        <input id="base-url" type="text" placeholder="http://127.0.0.1:1234" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">
        <span>Model</span>
        <input id="model" type="text" list="model-list" placeholder="google/gemma-4-e4b" autocomplete="off" spellcheck="false" />
        <datalist id="model-list"></datalist>
      </label>
      <label class="field">
        <span>API key <em>optional</em></span>
        <input id="api-key" type="password" placeholder="Only if your server asks for one" autocomplete="off" />
      </label>
      <p class="panel-note server-check" id="settings-note" role="status"></p>
      <div class="panel-actions">
        <button type="button" class="small-button" id="settings-cancel">Cancel</button>
        <button type="submit" class="small-button primary" id="settings-save">Save</button>
      </div>
    </form>
  </body>
</html>
